<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>检测报告在线查验</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    background:#f0f0f0;color:#333;
  }
  /* 顶部蓝色导航 */
  .topbar{
    background:#1e6fc4;color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 40px;flex:none;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    font-size:32px;font-weight:900;font-style:italic;letter-spacing:-2px;
    color:#fff;line-height:1;
  }
  .logo .red{color:#e63946;}
  .brand-text .cn{font-size:22px;font-weight:700;letter-spacing:2px;line-height:1.1;}
  .brand-text .en{font-size:11px;opacity:.9;letter-spacing:.5px;}
  .topbar-right{font-size:14px;display:flex;align-items:center;gap:14px;}
  .topbar-right a{color:#fff;text-decoration:none;}
  .topbar-right a:hover{text-decoration:underline;}
  .divider{opacity:.5;}
  /* 主查询区 */
  .hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 20px 40px;position:relative;overflow:hidden;
    background:#f2f2f2;
  }
  /* 同心圆纹理 */
  .hero::before{
    content:"";position:absolute;inset:0;
    background:repeating-radial-gradient(circle at 50% 50%,#e8e8e8 0px,#e8e8e8 1px,#f2f2f2 1px,#f2f2f2 40px);
    pointer-events:none;
  }
  .hero > *{position:relative;z-index:1;}
  h1{
    font-size:42px;color:#9a9a9a;font-weight:700;letter-spacing:8px;
    text-shadow:0 2px 3px rgba(255,255,255,.9),0 -1px 1px rgba(0,0,0,.08);
    margin-bottom:40px;
  }
  .search-box{
    display:flex;align-items:center;gap:0;
    background:#e6e6e6;border-radius:8px;padding:10px;
    width:100%;max-width:760px;
  }
  .search-box input{
    flex:1;height:48px;border:none;outline:none;background:#fff;
    padding:0 18px;font-size:17px;color:#333;letter-spacing:1px;
    border-radius:4px;text-transform:uppercase;
  }
  .search-box button{
    height:48px;padding:0 30px;margin-left:10px;border:none;
    background:#1a5fb4;color:#fff;font-size:17px;font-weight:600;
    border-radius:4px;cursor:pointer;letter-spacing:3px;
  }
  .search-box button:hover{background:#164a8f;}
  .slogan{margin-top:26px;color:#8a8a8a;font-size:15px;letter-spacing:1px;}
  /* 结果区 */
  .result-area{
    background:#ececec;padding:50px 20px;text-align:center;min-height:120px;
    display:none;
  }
  .result-area.show{display:block;}
  .result-msg{font-size:18px;font-weight:600;}
  .result-msg.ok{color:#e53935;}
  .result-msg.no{color:#999;}
  /* 底部版权 */
  .footer{
    background:#eef2f7;text-align:center;padding:18px;
    font-size:13px;color:#666;flex:none;
  }
  /* 悬浮客服按钮 */
  .chat-fab{
    position:fixed;right:18px;bottom:90px;width:44px;height:44px;
    border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;font-size:22px;
  }
  @media (max-width:640px){
    .topbar{padding:12px 16px;flex-direction:column;gap:6px;align-items:flex-start;}
    h1{font-size:26px;letter-spacing:4px;}
    .search-box{flex-direction:column;gap:10px;padding:10px;}
    .search-box button{margin-left:0;width:100%;}
  }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="brand">
    <div class="logo">TE<span class="red">C</span>C</div>
    <div class="brand-text">
      <div class="cn">中检通检测</div>
      <div class="en">HuNan TECC Testing Co.,Ltd.</div>
    </div>
  </div>
  <div class="topbar-right">
    <a href="#">网站主页</a>
    <span class="divider">|</span>
    <span>服务热线：400-6016-198</span>
  </div>
</div>

<!-- 主查询区 -->
<div class="hero">
  <h1>检测报告在线查验</h1>
  <div class="search-box">
    <input id="reportNo" type="text" placeholder="请输入报告编号" maxlength="40" autocomplete="off" spellcheck="false" />
    <button id="queryBtn" type="button">查 询</button>
  </div>
  <div class="slogan">互联网+检测一站式服务，进度实时查，拿证提速35%</div>
</div>

<!-- 结果区 -->
<div id="resultArea" class="result-area">
  <div id="resultMsg" class="result-msg"></div>
</div>

<!-- 悬浮客服 -->
<div class="chat-fab">&#128100;</div>

<!-- 底部版权 -->
<div class="footer">湖南中检通 版权所有</div>

<script>
(function(){
  var PREFIX = "ZJTA290702";
  var SUFFIX = "GR";
  var MIN_SEQ = 4779, MAX_SEQ = 4792;
  function isValidNo(s){
    if(s.length !== PREFIX.length + 4 + SUFFIX.length) return false;
    if(s.slice(0,PREFIX.length) !== PREFIX) return false;
    if(s.slice(-SUFFIX.length) !== SUFFIX) return false;
    var mid = s.slice(PREFIX.length, PREFIX.length+4);
    if(!/^\d{4}$/.test(mid)) return false;
    var n = parseInt(mid, 10);
    return n >= MIN_SEQ && n <= MAX_SEQ;
  }
  var input = document.getElementById('reportNo');
  var btn = document.getElementById('queryBtn');
  var resultArea = document.getElementById('resultArea');
  var resultMsg = document.getElementById('resultMsg');

  function query(){
    var val = input.value.trim().toUpperCase();
    if(!val){
      resultArea.className = 'result-area show';
      resultMsg.className = 'result-msg no';
      resultMsg.textContent = '请输入检测报告编号';
      return;
    }
    if(isValidNo(val)){
      resultArea.className = 'result-area show';
      resultMsg.className = 'result-msg ok';
      resultMsg.textContent = '报告编号为' + val + '的检测报告存在';
    } else {
      resultArea.className = 'result-area show';
      resultMsg.className = 'result-msg no';
      resultMsg.textContent = '未查询到编号为' + val + '的检测报告信息';
    }
  }
  btn.addEventListener('click', query);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') query(); });
})();
</script>
</body>
</html>
